name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const required = ['manifest_version', 'name', 'version', 'background', 'action'];
            const missing = required.filter((key) => !(key in manifest));
            if (missing.length > 0) {
              console.error('Missing required manifest fields:', missing.join(', '));
              process.exit(1);
            }
            if (manifest.manifest_version !== 3) {
              console.error('Expected manifest_version 3, got ' + manifest.manifest_version);
              process.exit(1);
            }
            console.log('manifest.json OK - version ' + manifest.version);
          "

      - name: Read extension version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/streamsnag-v${{ steps.version.outputs.version }}.zip" \
            manifest.json background.js content.js popup.html popup.css popup.js icons \
            -x "icons/generate-icons.ps1"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamsnag-extension
          path: dist/*.zip

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_check.outputs.tag }}
          name: ${{ steps.tag_check.outputs.tag }}
          generate_release_notes: true
          files: dist/*.zip
